name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check API syntax
        run: npm run build:api
      - name: Run API tests
        run: npm test --workspace=apps/api
      - name: Build web app
        run: npm run build:web
      - name: Audit production API dependencies
        run: npm audit --workspace=apps/api --omit=dev
